<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07100d">
  <title>Roon is starting</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#07100d;color:#f4f0e6;font-family:system-ui,sans-serif}body{display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 25%,#183129,transparent 48%),#07100d}.mark{width:18px;height:18px;margin:0 auto 24px;border-radius:50%;background:#65d2a7;box-shadow:0 0 28px #65d2a7;animation:pulse 1.5s ease-in-out infinite}h1{margin:0;font-size:clamp(32px,6vw,64px);font-weight:600}p{color:#98a5a0;font-size:clamp(16px,2vw,22px)}@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
  </style>
</head>
<body><main><div class="mark"></div><h1>Roon is starting</h1><p>The display will reconnect automatically.</p></main></body>
</html>
