<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1110">
  <title>Pi Bus Time Display</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <header><div><p class="eyebrow">MORNING BUS</p><h1 id="stop">Connecting…</h1></div><time id="clock">--:--</time></header>
    <section id="hero" class="hero waiting"><div><p class="eyebrow">NEXT USEFUL BUS</p><div id="next" class="next">—</div></div><div id="leave" class="leave">WAITING FOR DATA</div></section>
    <section id="services" class="services" aria-live="polite"></section>
    <footer><span id="status">Starting</span><span id="updated"></span></footer>
  </main>
  <section id="resting" class="resting" hidden><p class="eyebrow">PI BUS TIME DISPLAY</p><time id="rest-clock">--:--</time><p>Roon Bridge is ready</p></section>
  <script src="/app.js"></script>
</body>
</html>
