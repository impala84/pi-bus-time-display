<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="theme-color" content="#080b0a"><title>Roon · Pi Bus</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/refinements.css"></head>
<body><main>
  <a class="settings" href="http://127.0.0.1:8765/admin">SETTINGS</a>
  <section class="art"><img id="art" alt="Album artwork"><div id="placeholder">ROON</div></section>
  <section class="details"><p id="zone" class="eyebrow">ROON NOW PLAYING</p><h1 id="title">Waiting for Roon</h1><p id="artist">Enable Pi Bus Roon Controller in Roon → Settings → Extensions</p>
    <div class="timeline"><input id="seek" type="range" min="0" max="1" value="0" aria-label="Track position"><div><span id="elapsed">0:00</span><span id="remaining">−0:00</span></div></div>
    <div class="transport"><button id="previous" aria-label="Previous track" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6.5 9 12l10 5.5z"/></svg></button><button id="play" class="play" aria-label="Play or pause" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button><button id="next" aria-label="Next track" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6.5 15 12 5 17.5z"/></svg></button></div>
    <div id="volume-panel" class="volume" hidden><button id="mute">MUTE</button><input id="volume" type="range" min="0" max="100" value="0" aria-label="Volume"><output id="volume-value">—</output></div>
    <p id="fixed" class="fixed" hidden>FIXED VOLUME</p>
  </section>
</main><script src="/app.js"></script></body></html>
