[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-bus-time-display"
version = "0.3.0rc6"
description = "A Raspberry Pi morning bus-arrivals appliance for Singapore"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pi-bus-time-display = "pi_bus_time_display.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_bus_time_display = ["static/*"]
